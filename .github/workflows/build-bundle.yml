name: Build bundle

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or tag to build
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          # Cross-publish the macOS x64 bundle on Linux. The macOS x64 apphost
          # and native assets are resolved from NuGet; the bundle is validated
          # as Mach-O x86_64 instead of being executed. This avoids depending on
          # the hosted macOS runner, which was cancelled before starting steps.
          - os: ubuntu-latest
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Restore
        run: dotnet restore 5DO.sln --locked-mode

      - name: Publish CLI (single file, system runtime)
        run: >
          dotnet publish src/FiveDo.Cli/FiveDo.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -m:1
          -o artifacts/bundle/${{ matrix.rid }}/cli

      - name: Publish frontend (single file, system runtime)
        run: >
          dotnet publish src/FiveDo.Frontend.Avalonia/FiveDo.Frontend.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -m:1
          -o artifacts/bundle/${{ matrix.rid }}/frontend

      - name: Package bundle
        run: >
          pwsh -NoProfile -File packaging/package-bundle.ps1
          -Rid ${{ matrix.rid }}
          -CliPublishDirectory artifacts/bundle/${{ matrix.rid }}/cli
          -FrontendPublishDirectory artifacts/bundle/${{ matrix.rid }}/frontend
          -OutputDirectory artifacts/bundles

      - name: Locate versioned bundle
        id: bundle
        shell: pwsh
        run: |
          $pattern = if ('${{ matrix.rid }}' -like 'win-*') { '*.zip' } else { '*.tar.gz' }
          $archive = Get-ChildItem 'artifacts/bundles' -File -Filter $pattern |
            Where-Object { $_.Name -like "*${{ matrix.rid }}*" } |
            Select-Object -First 1
          if (-not $archive) {
            throw "No bundle archive matching '$pattern' and '${{ matrix.rid }}' was produced."
          }
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "archive-name=$($archive.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Bundle: $($archive.Name)"

      - name: Extract bundle for smoke tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/bundle-smoke -Force | Out-Null
          if ('${{ matrix.rid }}' -like 'win-*') {
            Expand-Archive -LiteralPath '${{ steps.bundle.outputs.archive }}' `
              -DestinationPath artifacts/bundle-smoke -Force
          }
          else {
            tar -xzf '${{ steps.bundle.outputs.archive }}' -C artifacts/bundle-smoke
          }

      - name: Verify bundle has no runtime or XML docs
        shell: pwsh
        run: |
          if (Test-Path 'artifacts/bundle-smoke/runtime') {
            throw 'The bundle must not contain a .NET runtime folder.'
          }
          $xml = Get-ChildItem 'artifacts/bundle-smoke' -Recurse -File -Filter '*.xml'
          if ($xml) {
            throw "The bundle must not contain XML documentation files: $($xml.Name -join ', ')"
          }

      - name: CLI smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          artifacts/bundle-smoke/FiveDo.Cli.exe --version
          artifacts/bundle-smoke/FiveDo.Cli.exe selftest --json

      - name: Frontend smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/bundle-smoke/FiveDo.Frontend.Avalonia.exe `
            -ArgumentList '--smoke-test', '--smoke-output', 'artifacts/bundle-smoke/frontend-smoke.txt' `
            -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Frontend smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Frontend smoke test failed with exit code $($process.ExitCode)."
          }
          Get-Content artifacts/bundle-smoke/frontend-smoke.txt
          if (-not (Select-String -Path artifacts/bundle-smoke/frontend-smoke.txt -Pattern 'FRONTEND SMOKE OK' -Quiet)) {
            throw 'Frontend smoke marker is missing.'
          }

      - name: Verify macOS bundle architecture
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: |
          set -euo pipefail
          file artifacts/bundle-smoke/FiveDo.Cli
          file artifacts/bundle-smoke/FiveDo.Frontend.Avalonia
          file artifacts/bundle-smoke/FiveDo.Cli | grep -q 'Mach-O 64-bit x86_64'
          file artifacts/bundle-smoke/FiveDo.Frontend.Avalonia | grep -q 'Mach-O 64-bit x86_64'

      - name: CLI and frontend smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          ./artifacts/bundle-smoke/FiveDo.Cli --version
          ./artifacts/bundle-smoke/FiveDo.Cli selftest --json
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a ./artifacts/bundle-smoke/FiveDo.Frontend.Avalonia \
            --smoke-test --smoke-output artifacts/bundle-smoke/frontend-smoke.txt
          cat artifacts/bundle-smoke/frontend-smoke.txt
          grep -q 'FRONTEND SMOKE OK' artifacts/bundle-smoke/frontend-smoke.txt

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-bundle-${{ matrix.rid }}
          path: artifacts/bundles/${{ steps.bundle.outputs.archive-name }}
          if-no-files-found: error
