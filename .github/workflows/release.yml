name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.0.0
      ref:
        description: Git ref to build (use master for a packaging refresh)
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build release bundles
    uses: ./.github/workflows/build-bundle.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  linux:
    name: Build Linux packages
    needs: bundle
    uses: ./.github/workflows/linux-packages.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      version: ''

  publish:
    name: Publish GitHub release
    needs: [bundle, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 5do-bundle-*
          path: dist
          merge-multiple: true

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 5do-linux-installers
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \
            \( -name '5do-*.zip' -o -name '5do-*.tar.gz' -o -name '5do-*.dmg' \
               -o -name '5do_*.deb' -o -name '5do-*.rpm' -o -name '5do-*.AppImage' \
               -o -name '5do-*.flatpak' \) \
            -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -f SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-linux.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "Publishing $tag ($version)"

          notes="docs/ReleaseNotes-${version}.md"
          if [ ! -f "$notes" ]; then
            notes="CHANGELOG.md"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; updating notes and assets."
            gh release edit "$tag" --title "5DO $version" --notes-file "$notes"
          else
            gh release create "$tag" --verify-tag --title "5DO $version" --notes-file "$notes"
          fi

          # Remove the old per-component archives, unversioned bundle names, and
          # retired GPG signature/keyring assets so a release page carries only the
          # current bundles, packages, and SHA256SUMS manifests.
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            case "$name" in
              5do-cli-*|5do-frontend-*|5do-win-x64.zip|5do-win-arm64.zip|5do-linux-x64.tar.gz|5do-linux-arm64.tar.gz|5do-osx-x64.tar.gz|5do-osx-arm64.tar.gz|5do-osx-x64.pkg|5do-osx-arm64.pkg|*.asc|5do-archive-keyring.gpg|5do-archive-keyring.gpg.asc|5do-archive-keyring.gpg.fingerprint)
                echo "Removing obsolete asset $name"
                gh release delete-asset "$tag" "$name" -y
                ;;
            esac
          done

          # Publish every asset the build produced. Optional artifacts (the AppImage
          # and the Flatpak bundle) are included only when they exist. Integrity is
          # validated with SHA256SUMS only; no signatures or keyring are uploaded.
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find dist -maxdepth 1 -type f \
            \( -name '5do-*.zip' -o -name '5do-*.tar.gz' -o -name '5do-*.dmg' \
               -o -name '5do_*.deb' -o -name '5do-*.rpm' -o -name '5do-*.AppImage' \
               -o -name '5do-*.AppImage.zsync' -o -name '5do-*.flatpak' \
               -o -name 'SHA256SUMS*.txt' \) \
            | sort)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets were produced." >&2
            exit 1
          fi
          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "$tag" "${assets[@]}" --clobber

          gh release edit "$tag" --latest
