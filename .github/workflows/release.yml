name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.0.0
      ref:
        description: Git ref to build (use master for a packaging refresh)
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build release bundles
    uses: ./.github/workflows/build-bundle.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

  publish:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 5do-bundle-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum 5do-*.zip 5do-*.tar.gz | tee SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "Publishing $tag ($version)"

          notes="docs/ReleaseNotes-${version}.md"
          if [ ! -f "$notes" ]; then
            notes="CHANGELOG.md"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; updating notes and assets."
            gh release edit "$tag" --title "5DO $version" --notes-file "$notes"
          else
            gh release create "$tag" --verify-tag --title "5DO $version" --notes-file "$notes"
          fi

          # Remove the old per-component archives and unversioned bundle names so
          # the release has one versioned bundle per system.
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            case "$name" in
              5do-cli-*|5do-frontend-*|5do-win-x64.zip|5do-win-arm64.zip|5do-linux-x64.tar.gz|5do-linux-arm64.tar.gz|5do-osx-x64.tar.gz|5do-osx-arm64.tar.gz)
                echo "Removing obsolete asset $name"
                gh release delete-asset "$tag" "$name" -y
                ;;
            esac
          done

          gh release upload "$tag" \
            dist/5do-*.zip \
            dist/5do-*.tar.gz \
            dist/SHA256SUMS.txt \
            --clobber

          gh release edit "$tag" --latest
