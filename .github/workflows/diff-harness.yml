name: Differential harness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: diff-harness-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  diff:
    name: 5DO vs OperaCore differential
    # Requires a self-hosted Windows machine with the BIOS and disc corpus.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100

      - name: Preflight
        id: preflight
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Test-Path 'bios/panafz1.bin')) { $missing += 'bios/panafz1.bin' }
          if (-not (Test-Path 'References/CPP_SimpleGui/cmake-build-release/SimpleGui/Core/OperaCore.dll')) {
            $missing += 'OperaCore.dll'
          }
          if (-not (Test-Path 'J:/Panasonic 3DO')) { $missing += 'J:/Panasonic 3DO' }
          if ($missing.Count -gt 0) {
            Write-Host "::notice::Differential harness skipped; missing $($missing -join ', ')"
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build
        if: steps.preflight.outputs.skip != 'true'
        run: |
          dotnet build src/FiveDo.Cli/FiveDo.Cli.csproj -c Release --nologo
          dotnet build tools/FiveDo.DiffHarness/FiveDo.DiffHarness.csproj -c Release --nologo

      - name: Validate manifest
        if: steps.preflight.outputs.skip != 'true'
        run: tools/FiveDo.DiffHarness/bin/Release/net11.0/FiveDo.DiffHarness.exe validate benchmarks/diff/showcase.json --strict

      - name: Run differential
        if: steps.preflight.outputs.skip != 'true'
        # A known divergence (for example Road Rash at 3,000 frames) is recorded in
        # the baseline; the baseline step below is the regression gate.
        continue-on-error: true
        # Always capture fresh results: a self-hosted workspace can keep an old
        # artifacts/diff/nightly tree, and --resume would silently reuse it.
        run: tools/FiveDo.DiffHarness/bin/Release/net11.0/FiveDo.DiffHarness.exe run benchmarks/diff/showcase.json --out artifacts/diff/nightly --force

      - name: Compare against baseline
        if: steps.preflight.outputs.skip != 'true'
        shell: pwsh
        run: |
          $current = 'artifacts/diff/nightly/report.json'
          if (-not (Test-Path $current)) {
            Write-Host '::error::The differential run did not produce report.json.'
            exit 1
          }

          $report = Get-Content $current -Raw | ConvertFrom-Json
          if ($report.summary.errors -gt 0) {
            Write-Host "::error::$($report.summary.errors) capture error(s) in the differential run."
            exit 1
          }

          $baseline = 'benchmarks/diff/baseline/showcase-report.json'
          if (-not (Test-Path $baseline)) {
            Write-Host '::notice::No differential baseline checked in; skipping the baseline gate.'
            exit 0
          }

          $exe = 'tools/FiveDo.DiffHarness/bin/Release/net11.0/FiveDo.DiffHarness.exe'
          & $exe baseline --baseline $baseline --current artifacts/diff/nightly/report.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::A 5DO field changed against the checked-in baseline. Review report.html and update benchmarks/diff/baseline/showcase-report.json if the change is intentional.'
            exit 1
          }

      - name: Upload report
        if: always() && steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-harness-report
          path: artifacts/diff/nightly
          if-no-files-found: warn
