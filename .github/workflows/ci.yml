name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore 3DOEmulator.sln

      - name: Build
        run: dotnet build 3DOEmulator.sln -c Release --no-restore

      - name: Test
        run: dotnet test 3DOEmulator.sln -c Release --no-build --no-restore

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format 3DOEmulator.sln --verify-no-changes --no-restore

      - name: Benchmark smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts
          dotnet run --project benchmarks/ThreeDo.Benchmarks -c Release --no-build -- \
            --frames 120 --label ci --json > artifacts/benchmark.json

      - name: Benchmark allocation gate
        if: matrix.os == 'ubuntu-latest'
        run: jq -e '.allocations.bytesPerFrame == 0' artifacts/benchmark.json

      - name: Upload benchmark baseline
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: artifacts/benchmark.json

  publish-cli:
    name: Publish CLI (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/ThreeDo.Cli/ThreeDo.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o artifacts/cli/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3do-cli-${{ matrix.rid }}
          path: artifacts/cli/${{ matrix.rid }}
          if-no-files-found: error
  publish-frontend:
    name: Publish frontend (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/ThreeDo.Frontend.Avalonia/ThreeDo.Frontend.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o artifacts/frontend/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3do-frontend-${{ matrix.rid }}
          path: artifacts/frontend/${{ matrix.rid }}
          if-no-files-found: error