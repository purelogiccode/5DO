name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore 5DO.sln

      - name: Build
        run: dotnet build 5DO.sln -c Release --no-restore

      - name: Test
        run: dotnet test 5DO.sln -c Release --no-build --no-restore

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format 5DO.sln --verify-no-changes --no-restore

      - name: Benchmark smoke and budget gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts
          dotnet run --project benchmarks/FiveDo.Benchmarks -c Release --no-build -- \
            --frames 120 --label ci --json --gate > artifacts/benchmark.json

      - name: Benchmark allocation gate
        if: matrix.os == 'ubuntu-latest'
        run: jq -e '.allocations.bytesPerFrame == 0' artifacts/benchmark.json

      - name: Trimmed CLI publish smoke
        if: matrix.os == 'windows-latest'
        run: |
          dotnet publish src/FiveDo.Cli/FiveDo.Cli.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -m:1 `
            -o artifacts/cli-trim
          artifacts/cli-trim/FiveDo.Cli.exe --version
          artifacts/cli-trim/FiveDo.Cli.exe selftest --json
          artifacts/cli-trim/FiveDo.Cli.exe bench --frames 2 --json

      - name: Trimmed frontend publish smoke
        if: matrix.os == 'windows-latest'
        run: |
          dotnet publish src/FiveDo.Frontend.Avalonia/FiveDo.Frontend.Avalonia.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -m:1 `
            -o artifacts/frontend-trim
          $process = Start-Process -FilePath artifacts/frontend-trim/FiveDo.Frontend.Avalonia.exe `
            -ArgumentList '--smoke-test', '--smoke-output', 'artifacts/frontend-smoke.txt' `
            -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Trimmed frontend smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Trimmed frontend smoke test failed with exit code $($process.ExitCode)."
          }
          Get-Content artifacts/frontend-smoke.txt
          if (-not (Select-String -Path artifacts/frontend-smoke.txt -Pattern 'FRONTEND SMOKE OK' -Quiet)) {
            throw 'Trimmed frontend smoke marker is missing.'
          }

      - name: Upload benchmark baseline
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-baseline
          path: artifacts/benchmark.json

  aot-cli:
    name: NativeAOT CLI (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish NativeAOT
        run: >
          dotnet publish src/FiveDo.Cli/FiveDo.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:FiveDoNativeAot=true
          -p:PublishSingleFile=true
          -m:1
          -o artifacts/cli-aot

      - name: NativeAOT smoke test
        run: |
          artifacts/cli-aot/FiveDo.Cli.exe --version
          artifacts/cli-aot/FiveDo.Cli.exe selftest --json
          artifacts/cli-aot/FiveDo.Cli.exe bench --frames 2 --json

      - name: Upload NativeAOT artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-cli-aot-win-x64
          path: artifacts/cli-aot
          if-no-files-found: error

  aot-frontend:
    name: NativeAOT frontend (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish NativeAOT
        run: >
          dotnet publish src/FiveDo.Frontend.Avalonia/FiveDo.Frontend.Avalonia.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:FiveDoNativeAot=true
          -m:1
          -o artifacts/frontend-aot

      - name: NativeAOT frontend smoke test
        run: |
          $process = Start-Process -FilePath artifacts/frontend-aot/FiveDo.Frontend.Avalonia.exe `
            -ArgumentList '--smoke-test', '--smoke-output', 'artifacts/frontend-aot-smoke.txt' `
            -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'NativeAOT frontend smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            throw "NativeAOT frontend smoke test failed with exit code $($process.ExitCode)."
          }
          Get-Content artifacts/frontend-aot-smoke.txt
          if (-not (Select-String -Path artifacts/frontend-aot-smoke.txt -Pattern 'FRONTEND SMOKE OK' -Quiet)) {
            throw 'NativeAOT frontend smoke marker is missing.'
          }

      - name: Upload NativeAOT artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-frontend-aot-win-x64
          path: artifacts/frontend-aot
          if-no-files-found: error

  publish-cli:
    name: Publish CLI (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/FiveDo.Cli/FiveDo.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -m:1
          -o artifacts/cli/${{ matrix.rid }}

      - name: Package
        run: >
          pwsh -NoProfile -File packaging/package.ps1
          -Component cli
          -Rid ${{ matrix.rid }}
          -PublishDirectory artifacts/cli/${{ matrix.rid }}
          -OutputDirectory artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-cli-package-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-cli-${{ matrix.rid }}
          path: artifacts/cli/${{ matrix.rid }}
          if-no-files-found: error
  publish-frontend:
    name: Publish frontend (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/FiveDo.Frontend.Avalonia/FiveDo.Frontend.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -m:1
          -o artifacts/frontend/${{ matrix.rid }}

      - name: Package
        run: >
          pwsh -NoProfile -File packaging/package.ps1
          -Component frontend
          -Rid ${{ matrix.rid }}
          -PublishDirectory artifacts/frontend/${{ matrix.rid }}
          -OutputDirectory artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-frontend-package-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-frontend-${{ matrix.rid }}
          path: artifacts/frontend/${{ matrix.rid }}
          if-no-files-found: error

  ci-complete:
    name: CI complete
    if: always()
    needs:
      - build-test
      - aot-cli
      - aot-frontend
      - publish-cli
      - publish-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        shell: bash
        run: |
          echo "build-test: ${{ needs.build-test.result }}"
          echo "aot-cli: ${{ needs.aot-cli.result }}"
          echo "aot-frontend: ${{ needs.aot-frontend.result }}"
          echo "publish-cli: ${{ needs.publish-cli.result }}"
          echo "publish-frontend: ${{ needs.publish-frontend.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required CI jobs failed." >&2
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required CI jobs were cancelled." >&2
            exit 1
          fi