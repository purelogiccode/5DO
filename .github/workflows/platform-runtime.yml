name: Platform runtime validation

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/platform-runtime.yml'
      - 'src/**'
      - 'packaging/**'

permissions:
  contents: read

concurrency:
  group: platform-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  runtime-smoke:
    name: Runtime smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rid: osx-x64
            name: macOS x64
            shell: bash
          - os: macos-latest
            rid: osx-arm64
            name: macOS arm64
            shell: bash
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            name: Linux arm64
            shell: bash
          - os: windows-11-arm
            rid: win-arm64
            name: Windows arm64
            shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.301

      - name: Restore
        run: dotnet restore 5DO.sln --locked-mode

      - name: Publish CLI
        run: >
          dotnet publish src/FiveDo.Cli/FiveDo.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -m:1
          -o artifacts/runtime/${{ matrix.rid }}/cli

      - name: Publish frontend
        run: >
          dotnet publish src/FiveDo.Frontend.Avalonia/FiveDo.Frontend.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -m:1
          -o artifacts/runtime/${{ matrix.rid }}/frontend

      - name: CLI smoke (macOS/Linux)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/runtime/${{ matrix.rid }}/cli/FiveDo.Cli
          chmod +x artifacts/runtime/${{ matrix.rid }}/frontend/FiveDo.Frontend.Avalonia
          file artifacts/runtime/${{ matrix.rid }}/cli/FiveDo.Cli
          file artifacts/runtime/${{ matrix.rid }}/frontend/FiveDo.Frontend.Avalonia
          artifacts/runtime/${{ matrix.rid }}/cli/FiveDo.Cli --version
          artifacts/runtime/${{ matrix.rid }}/cli/FiveDo.Cli selftest --json \
            > artifacts/runtime/${{ matrix.rid }}/selftest.json
          cat artifacts/runtime/${{ matrix.rid }}/selftest.json

      - name: Frontend smoke (Linux)
        if: matrix.rid == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a artifacts/runtime/${{ matrix.rid }}/frontend/FiveDo.Frontend.Avalonia \
            --smoke-test --smoke-output artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt
          cat artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt
          grep -q 'FRONTEND SMOKE OK' artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt

      - name: Frontend smoke (macOS)
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          artifacts/runtime/${{ matrix.rid }}/frontend/FiveDo.Frontend.Avalonia \
            --smoke-test --smoke-output artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt
          cat artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt
          grep -q 'FRONTEND SMOKE OK' artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt

      - name: CLI smoke (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          artifacts/runtime/${{ matrix.rid }}/cli/FiveDo.Cli.exe --version
          artifacts/runtime/${{ matrix.rid }}/cli/FiveDo.Cli.exe selftest --json |
            Tee-Object -FilePath artifacts/runtime/${{ matrix.rid }}/selftest.json

      - name: Frontend smoke (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/runtime/${{ matrix.rid }}/frontend/FiveDo.Frontend.Avalonia.exe `
            -ArgumentList '--smoke-test', '--smoke-output', 'artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt' `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Frontend smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Frontend smoke test failed with exit code $($process.ExitCode)."
          }
          Get-Content artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt
          if (-not (Select-String -Path artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt -Pattern 'FRONTEND SMOKE OK' -Quiet)) {
            throw 'Frontend smoke marker is missing.'
          }

      - name: Upload evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-runtime-${{ matrix.rid }}
          path: |
            artifacts/runtime/${{ matrix.rid }}/*.json
            artifacts/runtime/${{ matrix.rid }}/frontend-smoke.txt
          if-no-files-found: warn
