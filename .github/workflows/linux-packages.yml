name: Linux packages

# Builds the Linux distribution artifacts from the bundles produced by
# build-bundle.yml: .deb, .rpm, AppImage, and single-file Flatpak bundles for
# x64/arm64, plus an unsigned checksum manifest. Everything is published as GitHub
# release assets; 5DO does not host a package-manager repository, so users install
# the downloaded file directly (apt install ./5do_....deb, or
# flatpak install ./5do-x86_64.flatpak). Release integrity is validated with
# SHA256SUMS only; no GPG signatures or keyring are published.
#
# Each architecture is built on its own native runner. rpmbuild refuses to produce a
# foreign-architecture package on an x64 host ("No compatible architectures found for
# build"), so linux-arm64 uses the free ubuntu-24.04-arm runner.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or tag to package
        required: false
        type: string
        default: ''
      tag:
        description: Release tag to download bundles from (empty when artifacts are used)
        required: false
        type: string
        default: ''
      version:
        description: Version override (defaults to Directory.Build.props)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose Linux bundles are repackaged
        required: true
        type: string
      ref:
        description: Git ref to build the packaging scripts from
        required: false
        type: string
        default: master
      version:
        description: Version override (defaults to Directory.Build.props)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  packages:
    name: Linux packages (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
            image_arch: x86_64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
            image_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            appstream \
            desktop-file-utils \
            dpkg-dev \
            flatpak \
            flatpak-builder \
            rpm \
            shared-mime-info \
            zstd \
            zsync

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            version="0.0.0"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging 5DO $version for ${{ matrix.rid }}"

      - name: Download Linux bundle
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 5do-bundle-${{ matrix.rid }}
          path: artifacts/downloads

      - name: Download Linux bundle from the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/downloads
          gh release download '${{ inputs.tag }}' \
            --pattern "5do-*-${{ matrix.rid }}.tar.gz" \
            --dir artifacts/downloads \
            --clobber
          ls -l artifacts/downloads

      - name: Extract the ${{ matrix.rid }} bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifacts/downloads -maxdepth 1 -type f -name "5do-*-${{ matrix.rid }}.tar.gz" | head -n1)"
          if [ -z "$archive" ]; then
            echo "No ${{ matrix.rid }} bundle found." >&2
            exit 1
          fi
          mkdir -p "artifacts/bundle/${{ matrix.rid }}"
          tar -xzf "$archive" -C "artifacts/bundle/${{ matrix.rid }}"
          test -x "artifacts/bundle/${{ matrix.rid }}/FiveDo"
          test -x "artifacts/bundle/${{ matrix.rid }}/FiveDo.Cli"
          file "artifacts/bundle/${{ matrix.rid }}/FiveDo"

      - name: Build Debian and RPM packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/installers
          bash packaging/linux/build-deb.sh \
            --bundle "artifacts/bundle/${{ matrix.rid }}" \
            --rid "${{ matrix.rid }}" \
            --version "$VERSION" \
            --output artifacts/installers
          bash packaging/linux/build-rpm.sh \
            --bundle "artifacts/bundle/${{ matrix.rid }}" \
            --rid "${{ matrix.rid }}" \
            --version "$VERSION" \
            --output artifacts/installers
          ls -l artifacts/installers

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate packaging/5do.desktop packaging/5do-portable.desktop
          # AppStream checks that <launchable> resolves to an installed desktop file.
          sudo install -m 0644 packaging/5do.desktop /usr/share/applications/5do.desktop
          appstreamcli validate --no-net \
            packaging/linux/io.github.purelogiccode.FiveDO.metainfo.xml

          mime_dir="$(mktemp -d)"
          mkdir -p "$mime_dir/packages"
          cp packaging/linux/5do.xml "$mime_dir/packages/"
          update-mime-database "$mime_dir"
          test -f "$mime_dir/mime.cache"

          deb="$(find artifacts/installers -maxdepth 1 -name "5do_*_${{ matrix.deb_arch }}.deb" | head -n1)"
          if [ -z "$deb" ]; then
            echo "No ${{ matrix.deb_arch }} .deb was produced." >&2
            exit 1
          fi
          dpkg-deb -f "$deb" Package Version Architecture Depends Recommends
          dpkg-deb -c "$deb" > artifacts/deb-contents.txt
          grep -q 'usr/share/metainfo/io.github.purelogiccode.FiveDO.metainfo.xml' artifacts/deb-contents.txt
          grep -q 'usr/share/applications/5do.desktop' artifacts/deb-contents.txt
          grep -q 'usr/share/icons/hicolor/256x256/apps/5do.png' artifacts/deb-contents.txt
          grep -q 'usr/share/doc/5do/copyright' artifacts/deb-contents.txt

          rpm="$(find artifacts/installers -maxdepth 1 -name "5do-*.${{ matrix.rpm_arch }}.rpm" | head -n1)"
          if [ -z "$rpm" ]; then
            echo "No ${{ matrix.rpm_arch }} .rpm was produced." >&2
            exit 1
          fi
          rpm -qip "$rpm" | sed -n '1,12p'
          rpm -qlp "$rpm" > artifacts/rpm-contents.txt
          grep -q 'usr/share/metainfo/io.github.purelogiccode.FiveDO.metainfo.xml' artifacts/rpm-contents.txt
          grep -q 'usr/share/applications/5do.desktop' artifacts/rpm-contents.txt

      - name: Build AppImage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_ARCH: ${{ matrix.image_arch }}
        run: |
          set -euo pipefail
          tool_dir="artifacts/tools"
          mkdir -p "$tool_dir"
          url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${IMAGE_ARCH}.AppImage"
          # The arm64 asset intermittently 504s from the release CDN; retry before
          # skipping, or the run ships without an AppImage for that architecture.
          if ! curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              -o "$tool_dir/appimagetool.AppImage" "$url"; then
            echo "::warning::appimagetool download failed after retries; the AppImage is skipped for this run."
            exit 0
          fi
          chmod +x "$tool_dir/appimagetool.AppImage"
          (cd "$tool_dir" && ./appimagetool.AppImage --appimage-extract >/dev/null)
          name="5do-${VERSION}-linux-${IMAGE_ARCH}.AppImage"
          bash packaging/linux/build-appimage.sh \
            --bundle "artifacts/bundle/${{ matrix.rid }}" \
            --version "$VERSION" \
            --arch "$IMAGE_ARCH" \
            --output artifacts/installers \
            --appimagetool "$tool_dir/squashfs-root/AppRun" \
            --name "$name" \
            --zsync-url "https://github.com/purelogiccode/5DO/releases/download/v${VERSION}/$name" \
            --update-information "gh-releases-zsync|purelogiccode|5DO|latest|5do-*-linux-${IMAGE_ARCH}.AppImage.zsync"
          test -x "artifacts/installers/$name"

      - name: Build Flatpak bundle
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_ARCH: ${{ matrix.image_arch }}
        run: |
          set -euo pipefail
          bash packaging/linux/build-flatpak.sh \
            --bundle "artifacts/bundle/${{ matrix.rid }}" \
            --rid "${{ matrix.rid }}" \
            --version "$VERSION" \
            --output artifacts/installers

          bundle="artifacts/installers/5do-${VERSION}-linux-${IMAGE_ARCH}.flatpak"
          test -f "$bundle"

          # Install the shipped bundle and run the CLI inside the sandbox: this proves
          # the self-contained apphosts start against the Flatpak runtime.
          flatpak install --user --noninteractive -y "$bundle"
          flatpak run --command=5do-cli io.github.purelogiccode.FiveDO --version
          flatpak run --command=5do-cli io.github.purelogiccode.FiveDO selftest --json

      - name: Upload ${{ matrix.rid }} packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-linux-pkg-${{ matrix.deb_arch }}
          path: artifacts/installers
          if-no-files-found: error

  publish:
    name: Publish Linux packages
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download per-architecture packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 5do-linux-pkg-*
          path: artifacts/installers
          merge-multiple: true

      - name: Generate Linux checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/installers
          find . -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.flatpak' \) \
            -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Install and smoke-test the Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find artifacts/installers -maxdepth 1 -name '5do_*_amd64.deb' | head -n1)"
          if [ -z "$deb" ]; then
            echo "No amd64 .deb was produced." >&2
            exit 1
          fi

          # A local-file install is exactly what a release download does. It also
          # proves the dependency list resolves on the runner's distro.
          sudo apt-get install -y "$PWD/$deb"
          test -L /usr/bin/5do
          test -L /usr/bin/5do-cli
          test -f /usr/share/applications/5do.desktop
          test -f /usr/share/mime/packages/5do.xml
          test -f /usr/share/metainfo/io.github.purelogiccode.FiveDO.metainfo.xml
          test -f /usr/share/icons/hicolor/256x256/apps/5do.png

          5do --version
          5do-cli selftest --json
          5do-cli doctor

          sudo apt-get remove -y 5do
          if [ -e /usr/bin/5do ]; then
            echo "The package removal left /usr/bin/5do behind." >&2
            exit 1
          fi

      - name: Install and smoke-test the RPM package
        shell: bash
        run: |
          set -euo pipefail
          rpm_file="$(find artifacts/installers -maxdepth 1 -name '5do-*.x86_64.rpm' | head -n1)"
          if [ -z "$rpm_file" ]; then
            echo "No x86_64 .rpm was produced." >&2
            exit 1
          fi

          # rpm works on the Ubuntu runner with --nodeps. The point is to prove that the
          # shipped apphosts still run after packaging (brp-strip must not touch them).
          sudo rpm -i --nodeps "$PWD/$rpm_file"
          /opt/5do/FiveDo --version
          /opt/5do/FiveDo.Cli --version
          test -L /usr/bin/5do
          test -L /usr/bin/5do-cli

          sudo rpm -e 5do
          if [ -e /opt/5do ]; then
            echo "The RPM removal left /opt/5do behind." >&2
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 5do-linux-installers
          path: artifacts/installers
          if-no-files-found: error
