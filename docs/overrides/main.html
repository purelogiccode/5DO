{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set page_title = page.title if page and page.title else config.site_name %}
  {% set page_description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page_title }} · {{ config.site_name }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta property="og:image" content="{{ 'assets/logo.png' | url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }} · {{ config.site_name }}">
  <meta name="twitter:description" content="{{ page_description }}">
  <meta name="twitter:image" content="{{ 'assets/logo.png' | url }}">
  <meta name="theme-color" content="#0b1020">
{% endblock %}
